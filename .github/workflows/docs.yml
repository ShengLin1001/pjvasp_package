name: Publish Sphinx documentation

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/docs.yml"
      - "docs/**"
      - "mymetal/**"
      - "lmp_utils/**"
      - "myvasp/**"
      - "n2p2_utils/**"
      - "slurm_utils/**"
      - "vasp_utils/**"
      - "requirements.txt"
      - "setup.py"
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Install myalloy runtime helpers
        run: python -m pip install --no-deps "git+https://github.com/ShengLin1001/myalloy_package.git@master"

      - name: Run documentation examples
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          python docs/examples/getting_started_au111.py --output docs/_build/example-au111
          python docs/examples/fcc_surfaces.py --output docs/_build/example-fcc-surfaces
          python docs/examples/hcp_surfaces.py --output docs/_build/example-hcp-surfaces
          python docs/examples/bulk_structures.py --output docs/_build/example-bulk
          python docs/examples/eos_curve.py --output docs/_build/example-eos
          python docs/examples/biaxial_stretch.py --output docs/_build/example-biaxial
          python docs/examples/kpoints_sampling.py --output docs/_build/example-kpoints
          python docs/examples/schmid_factor.py --output docs/_build/example-schmid
          python docs/examples/neighbor_distances.py --output docs/_build/example-neighbor
          python docs/examples/atom_manipulation.py --output docs/_build/example-manipulation
          python docs/examples/strain_deformation.py --output docs/_build/example-strain
          python docs/examples/surface_energy.py
          python docs/examples/outcar_summary.py mymetal/example/test-post/y_dir -cases 0.997 1.000 -output docs/_build/outcar-summary.csv
          python docs/examples/gsfe_models.py --output docs/_build/example-gsfe
          python docs/examples/cubic_cell_and_stretch.py --output docs/_build/example-cubic-stretch
          python docs/scripts/generate_structure_images.py

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build Sphinx documentation
        run: python -m sphinx -b html -W --keep-going docs/source docs/_build/html

      - name: Disable Jekyll processing
        run: touch docs/_build/html/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  linkcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.10"
          cache: pip
          cache-dependency-path: docs/requirements.txt

      - name: Install documentation dependencies
        run: python -m pip install -r docs/requirements.txt

      - name: Install myalloy runtime helpers
        run: python -m pip install --no-deps "git+https://github.com/ShengLin1001/myalloy_package.git@master"

      - name: Check external links
        run: python -m sphinx -b linkcheck -W --keep-going docs/source docs/_build/linkcheck

  deploy:
    if: github.event_name != 'schedule'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v5
